# One-off: Tensor Studio on typical London sites (branch test/tensor-generality only; not merged)
name: Tensor Studio generality test
on:
  push:
    branches: [test/tensor-generality]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tools
        working-directory: tools/tensor-generality
        run: npm init -y >/dev/null && npm i @mapbox/vector-tile@1.3.1 pbf@3.2.1 playwright@1.48.2
      - name: Read the sites from the map's vector tiles
        working-directory: tools/tensor-generality
        run: node fetch-sites.mjs
      - name: Serve the repository
        run: nohup python3 -m http.server 8123 >/dev/null 2>&1 &
      - name: Run Tensor Studio on every site
        working-directory: tools/tensor-generality
        env: { CHROME: /usr/bin/google-chrome }
        run: node run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tensor-generality
          retention-days: 7
          path: |
            tools/tensor-generality/out/
            tools/tensor-generality/sites/
