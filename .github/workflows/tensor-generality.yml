# One-off: Tensor Studio on typical London sites (branch test/tensor-generality only; not merged)
name: Tensor Studio generality test
on:
  push:
    branches: [test/tensor-generality]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tools
        working-directory: tools/tensor-generality
        run: npm init -y >/dev/null && npm i @mapbox/vector-tile@1.3.1 pbf@3.2.1 playwright@1.48.2
      - name: Read the sites from the map's vector tiles
        working-directory: tools/tensor-generality
        run: node fetch-sites.mjs
      - name: Serve the repository
        run: nohup python3 -m http.server 8123 >/dev/null 2>&1 &
      - name: Run Tensor Studio on every site
        working-directory: tools/tensor-generality
        env: { CHROME: /usr/bin/google-chrome, ONLY: 'soho,soho-r20,hampstead,hampstead-r20,bexleyheath,bexleyheath-r20,crewshill,crewshill-r20', KEEP: '0' }
        run: node run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tensor-generality
          retention-days: 7
          path: |
            tools/tensor-generality/out/
            tools/tensor-generality/sites/
      - name: Keep the results on a branch (artifact downloads are not reachable from the analysis session)
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r tools/tensor-generality/out /tmp/res/out2 && mkdir -p /tmp/res/context
          for f in tools/tensor-generality/sites/*.json; do node -e "const d=require('./'+process.argv[1]);console.log(JSON.stringify({id:d.site.id,context:d.context,counts:Object.fromEntries(Object.entries(d.features).map(([k,v])=>[k,v.length]))}))" "$f"; done > /tmp/res/context/sites.jsonl
          cd /tmp/res && git init -q && git checkout -q -b test/tensor-generality-out && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test/tensor-generality-out
