<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>极小曲面目录</title>
<style>
/* VOICE: quiet studio instrument, nothing competes with the form
   IDEA: a lit physical model on a black plinth at an AADRL crit
   PICTURE: the exact Weber Scherk–Enneper surface, full screen, orbitable
   COLOUR and TYPE: black ground, olive front face + lavender back face (as the reference), ice-white accent; SF / PingFang
   LAYOUT: full viewport, one floating glass panel, one four-button dock */
:root{color-scheme:dark;--ink:#E8ECF2;--mute:#8A94A3;--line:rgba(255,255,255,.08);--glass:rgba(20,22,26,.74);--acc:#D9E3F0}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%;background:#000;color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
body.v{overflow:hidden;height:100%}
#viewer{display:none}body.v #viewer{display:block}body.v #home{display:none}
#home{max-width:1240px;margin:0 auto;padding:clamp(28px,5vw,64px) max(5vw,16px) 64px}
.hero h1{margin:0;font-size:clamp(32px,5vw,48px);line-height:1.05;font-weight:600;letter-spacing:-.01em}
.hero p{margin:10px 0 0;color:var(--mute);font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:28px 0 8px}
.seg{display:inline-flex;padding:3px;border:1px solid #2A2F36;border-radius:999px}
.seg button{height:34px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:#C9D1DC;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--acc);color:#0b0d10}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{height:34px;padding:0 14px;border:1px solid #2A2F36;border-radius:999px;background:transparent;color:#C9D1DC;font:inherit;font-size:13px;cursor:pointer}
.tags button.on{background:var(--acc);border-color:var(--acc);color:#0b0d10}
.cat{margin-top:40px;border-top:1px solid #1C2026;padding-top:18px}
.cat h2{margin:0;font-size:20px;font-weight:500;display:flex;align-items:baseline;gap:10px}
.cat h2 small{color:var(--mute);font-size:13px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:16px}
.card{all:unset;display:block;cursor:pointer;border:1px solid #1C2026;border-radius:16px;overflow:hidden;background:#07080a;transition:border-color .2s}
.card:hover,.card:focus-visible{border-color:var(--acc)}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#000}
.card .meta{padding:12px 14px 14px}
.card .no{color:#8C9A78;font-size:12px}
.card .nm{font-size:16px;margin:2px 0 6px;color:#fff}
.card .sub{color:var(--mute);font-size:12px}
.pill{display:inline-block;margin:8px 4px 0 0;padding:2px 8px;border:1px solid #2A2F36;border-radius:999px;font-size:11px;color:#C9D1DC}
.empty{border:1px dashed #2A2F36;border-radius:16px;aspect-ratio:3/4;display:grid;place-items:center;color:#4A525C;font-size:13px;max-width:260px}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #1C2026;vertical-align:top}
th{color:var(--mute);font-weight:400;font-size:12px}
td a{color:#fff;text-decoration:none;border-bottom:1px solid #3A414B}
.back{all:unset;pointer-events:auto;cursor:pointer;color:var(--mute);font-size:13px;display:inline-flex;align-items:center;gap:4px;height:32px;margin-bottom:4px}
.back:hover{color:#fff}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:5.5em}.stack td::before{content:attr(data-l);float:inline-start;width:5em;margin-inline-start:-5.5em;color:var(--mute)}}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ref{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:.5;display:none}
.title{position:fixed;top:20px;left:24px;pointer-events:none}
.title b{display:block;font-weight:500;font-size:17px;letter-spacing:.01em}
.title span{color:var(--mute);font-size:13px}
.panel{position:fixed;top:16px;right:16px;width:264px;max-height:calc(100% - 110px);overflow:auto;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.panel>button{all:unset;display:flex;justify-content:space-between;align-items:center;width:100%;height:44px;cursor:pointer;color:var(--mute);font-size:13px}
.panel>button svg{width:16px;height:16px;transition:transform .2s}
.panel.closed>button svg{transform:rotate(-90deg)}
.panel.closed .body{display:none}
.body{padding-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.chips button{height:30px;padding:0 11px;border:1px solid #2A2F36;border-radius:999px;background:transparent;color:#C9D1DC;font:inherit;font-size:12px;cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#0b0d10}
.row{padding:4px 0}
.row label{display:flex;justify-content:space-between;font-size:13px;color:#C9D1DC}
.row output{color:#fff;font-variant-numeric:tabular-nums}
.row.hide{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(var(--acc),var(--acc)) 0 0/var(--p,50%) 100% no-repeat,#2A2F36}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:2px;background:#2A2F36}
input[type=range]::-moz-range-progress{height:2px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line);border-radius:999px}
.dock button{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#C9D1DC;display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.dock button:hover{background:rgba(255,255,255,.08)}
.dock button.on{color:#0b0d10;background:var(--acc)}
.dock svg{width:20px;height:20px}
.stat{position:fixed;left:24px;bottom:30px;color:#5E6773;font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,8px);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.panel{top:auto;bottom:84px;left:12px;right:12px;width:auto;max-height:55%}.stat{display:none}.title{top:16px;left:18px}.toast{bottom:150px}}
@media(prefers-reduced-motion:reduce){.toast,.panel>button svg{transition:none}}
</style>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}
const MM = 10; // 1 模型单位 = 10 mm

/* =====================================================================
   001 · Scherk–Enneper（M. Weber, "Singly Periodic Scherk Surface with Enneper Ends"）
   G(z)  = c z^{k-1}(z^{2k}−a^{2k})/(z^{2k}−a^{−2k}),  c = (1−a^{−2k})/(1−a^{2k})
   dh(z) = i z^{k-1}(z^{2k}−a^{2k})(z^{2k}−a^{−2k})/(z^{2k}−1)^3
   ===================================================================== */
const GLX = [-Math.sqrt(0.6), 0, Math.sqrt(0.6)], GLW = [5/9, 8/9, 5/9];
function seOmega(k, a){
  const A = a**(2*k), B = a**(-2*k), c = (1-B)/(1-A);
  return function(zr, zi, out){
    let pr = 1, pi = 0;
    for (let i=0; i<k-1; i++){ const t = pr*zr - pi*zi; pi = pr*zi + pi*zr; pr = t; }
    let Zr = pr*zr - pi*zi, Zi = pr*zi + pi*zr;
    const t2 = Zr*Zr - Zi*Zi; Zi = 2*Zr*Zi; Zr = t2;
    const ar = Zr - A, br = Zr - B, mr = Zr - 1, im = Zi;
    let dr = mr*mr - im*im, di = 2*mr*im; const d3r = dr*mr - di*im, d3i = dr*im + di*mr;
    const dd = d3r*d3r + d3i*d3i, ir = d3r/dd, ii = -d3i/dd;
    const qr = ar*br - im*im, qi = ar*im + im*br;
    let hr = pr*qr - pi*qi, hi = pr*qi + pi*qr;
    let tr = hr*ir - hi*ii, ti = hr*ii + hi*ir;
    const dhr = -ti, dhi = tr;
    const z2r = pr*pr - pi*pi, z2i = 2*pr*pi, a2r = ar*ar - im*im, a2i = 2*ar*im;
    hr = z2r*a2r - z2i*a2i; hi = z2r*a2i + z2i*a2r;
    tr = hr*ir - hi*ii; ti = hr*ii + hi*ir;
    const gr = -c*ti, gi = c*tr;
    const b2r = br*br - im*im, b2i = 2*br*im;
    tr = b2r*ir - b2i*ii; ti = b2r*ii + b2i*ir;
    const hgr = -ti/c, hgi = tr/c;
    out[0] = (hgr - gr)/2; out[1] = (hgi - gi)/2;
    const sr = (hgr + gr)/2, si = (hgi + gi)/2;
    out[2] = -si; out[3] = sr; out[4] = dhr; out[5] = dhi;
  };
}
function seZ(u, v, k){
  const e = Math.exp(u), er = e*Math.cos(v), ei = e*Math.sin(v);
  const dr = -1 - ei, di = er, dd = dr*dr + di*di;
  const tr = 1 + 2*dr/dd, ti = -2*di/dd;
  const r = Math.hypot(tr, ti), th = Math.atan2(ti, tr), rk = r**(1/k), tk = th/k;
  return [rk*Math.cos(tk), rk*Math.sin(tk)];
}
const SE_NU = 36, SE_NV = 18, SE_SUB = 4;
function sePatch(k, a, rmax){
  const om = seOmega(k, a), o = new Float64Array(6);
  const nu = SE_NU*SE_SUB+1, nv = SE_NV*SE_SUB+1;
  const Zr = new Float64Array(nu*nv), Zi = new Float64Array(nu*nv);
  for (let i=0; i<nu; i++) for (let j=0; j<nv; j++){
    const z = seZ(rmax*i/(nu-1), Math.PI/2 + Math.PI/2*j/(nv-1), k);
    Zr[i*nv+j] = z[0]; Zi[i*nv+j] = z[1];
  }
  function seg(p, q, acc){
    const ar = Zr[p], ai = Zi[p], dr = Zr[q]-ar, di = Zi[q]-ai;
    let s0r=0,s0i=0,s1r=0,s1i=0,s2r=0,s2i=0;
    for (let g=0; g<3; g++){
      const x = (1+GLX[g])/2; om(ar + dr*x, ai + di*x, o);
      s0r += GLW[g]*o[0]; s0i += GLW[g]*o[1]; s1r += GLW[g]*o[2]; s1i += GLW[g]*o[3]; s2r += GLW[g]*o[4]; s2i += GLW[g]*o[5];
    }
    acc[0] += (s0r*dr - s0i*di)/2; acc[1] += (s1r*dr - s1i*di)/2; acc[2] += (s2r*dr - s2i*di)/2;
  }
  const X = new Float64Array(nu*nv*3), acc = [0,0,0];
  for (let j=nv-2; j>=0; j--){ seg(j+1, j, acc); X[j*3]=acc[0]; X[j*3+1]=acc[1]; X[j*3+2]=acc[2]; }
  for (let j=0; j<nv; j++){
    acc[0]=X[j*3]; acc[1]=X[j*3+1]; acc[2]=X[j*3+2];
    for (let i=1; i<nu; i++){ seg((i-1)*nv+j, i*nv+j, acc); const q = (i*nv+j)*3; X[q]=acc[0]; X[q+1]=acc[1]; X[q+2]=acc[2]; }
  }
  const W = SE_NV+1, out = new Float64Array((SE_NU+1)*W*3);
  for (let i=0; i<=SE_NU; i++) for (let j=0; j<=SE_NV; j++){
    const s = ((i*SE_SUB)*nv + j*SE_SUB)*3, d = (i*W+j)*3;
    out[d] = X[s]-X[0]; out[d+1] = X[s+1]-X[1]; out[d+2] = X[s+2]-X[2];
  }
  return {pos: out, nu: SE_NU+1, nv: W, h: -X[2]};
}

/* =====================================================================
   002 · Helicoidal Karcher–Scherk（H. Karcher 1988；M. Weber notebook）
   上半平面 w：phi1 = ½R²(R²−w)^{a−1} w^{1−1/k}(1+R²w)^{−1−a}
               phi2 = −½R²(R²−w)^{−1−a} w^{−1+1/k}(1+R²w)^{−1+a}
               dh   = (i/2) / (w(1/R² − R² − 1/w + w))
   R 由周期条件数值求解；每点沿直线从 i 积分（双指数求积）
   ===================================================================== */
function cpow(r, i, p){ const m = Math.hypot(r, i); if (m === 0) return [0,0]; const l = Math.log(m)*p, t = Math.atan2(i, r)*p, e = Math.exp(l); return [e*Math.cos(t), e*Math.sin(t)]; }
function cm(a, b){ return [a[0]*b[0]-a[1]*b[1], a[0]*b[1]+a[1]*b[0]]; }
function hkOmega(k, a, R, wr, wi, out){
  const R2 = R*R;
  const Ar = R2 - wr, Ai = -wi, Cr = 1 + R2*wr, Ci = R2*wi;
  const p1 = cm(cm(cpow(Ar, Ai, a-1), cpow(wr, wi, 1-1/k)), cpow(Cr, Ci, -1-a));
  const p2 = cm(cm(cpow(Ar, Ai, -1-a), cpow(wr, wi, -1+1/k)), cpow(Cr, Ci, -1+a));
  const f1r = 0.5*R2*p1[0], f1i = 0.5*R2*p1[1], f2r = -0.5*R2*p2[0], f2i = -0.5*R2*p2[1];
  // dh = 0.5 i / (w² + w(1/R² − R²) − 1)
  const qr = wr*wr - wi*wi + wr*(1/R2 - R2) - 1, qi = 2*wr*wi + wi*(1/R2 - R2), qq = qr*qr + qi*qi;
  const dhr = 0.5*qi/qq, dhi = 0.5*qr/qq;
  out[0] = -(f1r - f2r)/2; out[1] = -(f1i - f2i)/2;
  const sr = (f1r + f2r)/2, si = (f1i + f2i)/2;
  out[2] = -si; out[3] = sr; out[4] = dhr; out[5] = dhi;
}
const DE = (() => { const h = 1/16, T = [], Wt = []; for (let t=-3.2; t<=3.2+1e-9; t+=h){ const u = Math.PI/2*Math.sinh(t); T.push(1/(1+Math.exp(2*u))); Wt.push(h*Math.PI/2*Math.cosh(t)/Math.cosh(u)**2/2); } return {T, Wt}; })();
function hkF0(k, a, R, Wr, Wi, out){
  const dr = Wr, di = Wi - 1, o = new Float64Array(6);
  let s0r=0,s0i=0,s1r=0,s1i=0,s2r=0,s2i=0;
  for (let n=0; n<DE.T.length; n++){
    const om = DE.T[n], w = DE.Wt[n];
    hkOmega(k, a, R, Wr - om*dr, Wi - om*di, o);
    s0r += w*o[0]; s0i += w*o[1]; s1r += w*o[2]; s1i += w*o[3]; s2r += w*o[4]; s2i += w*o[5];
  }
  out[0] = s0r*dr - s0i*di; out[1] = s1r*dr - s1i*di; out[2] = s2r*dr - s2i*di;
}
// 周期条件（与 notebook 的 test[k,a][R] 相同；Hypergeometric2F1Regularized 改写为 Euler 积分）
const GL64 = (() => { const n = 64, x = [], w = []; for (let i=1; i<=n; i++){ let z = Math.cos(Math.PI*(i-0.25)/(n+0.5)), pp;
  for (let it=0; it<100; it++){ let p1 = 1, p2 = 0; for (let j=1; j<=n; j++){ const p3 = p2; p2 = p1; p1 = ((2*j-1)*z*p2 - (j-1)*p3)/j; } pp = n*(z*p1 - p2)/(z*z - 1); const z1 = z; z = z1 - p1/pp; if (Math.abs(z-z1) < 1e-15) break; }
  x.push(z); w.push(2/((1-z*z)*pp*pp)); } return {x, w}; })();
function betaInt(p, q, h){
  let I = 0; const vmax = 0.5**p, umax = 0.5**q;
  for (let i=0; i<64; i++){ const g = (GL64.x[i]+1)/2;
    const t1 = (g*vmax)**(1/p); I += GL64.w[i]*(1-t1)**(q-1)*h(t1)*vmax/2/p;
    const t2 = 1-(g*umax)**(1/q); I += GL64.w[i]*t2**(p-1)*h(t2)*umax/2/q; }
  return I;
}
function hkTest(k, a, R){
  const p1 = 0.5*R**(4+2*a-2/k)*betaInt(2-1/k, a, t => (1+R**4*t)**(-1-a));
  const p2 = 0.5*R**(-2*(a+1/k))*betaInt(1/k, a, t => (1+t/R**4)**(-1-a));
  return p2/Math.sin(a*Math.PI+Math.PI/k)*(Math.sin(a*Math.PI)-Math.sin(Math.PI/k)) + p1;
}
function hkSolveR(k, a){
  let px = 0.05, pf = hkTest(k, a, px);
  for (let i=1; i<=200; i++){
    const x = 0.05 + (0.9999-0.05)*i/200, f = hkTest(k, a, x);

function gridTopo(nu, nv, lu, lv){

  for (let i=0; i<nu-1; i++) for (let j=0; j<nv-1; j++){ const p = i*nv+j, q = p+nv; tri.push(p, q, p+1, p+1, q, q+1); }
  for (let i=0; i<nu; i+=lu) for (let j=0; j<nv-1; j++) line.push(i*nv+j, i*nv+j+1);
  if ((nu-1) % lu) for (let j=0; j<nv-1; j++) line.push((nu-1)*nv+j, (nu-1)*nv+j+1);
  for (let j=0; j<nv; j+=lv) for (let i=0; i<nu-1; i++) line.push(i*nv+j, (i+1)*nv+j);
  if ((nv-1) % lv) for (let i=0; i<nu-1; i++) line.push(i*nv+nv-1, (i+1)*nv+nv-1);

  let zmin = Infinity, zmax = -Infinity;

    const lb = c*topo.line.length;
    for (let q=0; q<topo.line.length; q++) lin[lb+q] = b+topo.line[q];

     ts = ts.concat(ts.map(t => comp({m:[1,0,0, 0,1,0, 0,0,-1], o:[0,0,2*h], f:true}, t)));
     let tr = []; for (let m=0; m<n; m++) tr = tr.concat(ts.map(t => comp({m:I3, o:[0,0,m*4*h], f:false}, t)));
     tr = tr.map(t => comp({m:[1,0,0, 0,1,0, 0,0,-1], o:[0,0,0], f:true}, t));
     return emit(pt.pos, pt.nu*pt.nv, topo, tr);
   }},

   presets:[{name:'原图', k:8,a:0.05,x:5,n:3}, {name:'4 端 · 微扭', k:2,a:0.10,x:5,n:3}, {name:'4 端 · 强扭', k:2,a:0.40,x:5,n:3}, {name:'6 端', k:3,a:0.10,x:5,n:3}, {name:'6 端 · 强扭', k:3,a:0.30,x:5,n:3}, {name:'8 端', k:4,a:0.20,x:5,n:3}, {name:'10 端', k:5,a:0.05,x:5,n:3}],
   clamp(P){ const mx = 1/P.k - 0.005; if (P.a > mx) P.a = +mx.toFixed(3); },
   build(P){
     const {k, a, x, n} = P, R = hkSolveR(k, a);
     if (!R) return null;
     const pt = hkPatch(k, a, R, x), topo = gridTopo(pt.nu, pt.nv, 2, 2), trans = Math.PI*R*R/(1+R**4);
     const ts = [], j0 = -Math.floor(n/2);
     for (let j=j0; j<j0+n; j++) for (let i=1; i<=k; i++){
       const odd = ((i+j) % 2 + 2) % 2 === 1, Rj = rotZ(2*a*Math.PI*j - 2*Math.PI*i/k, j*trans, odd);
       ts.push(comp(Rj, {m:I3, o:[0,0,0], f:false}));
       ts.push(comp(Rj, {m:[1,0,0, 0,-1,0, 0,0,-1], o:[0,0,0], f:true}));
     }
     const out = emit(pt.pos, pt.nu*pt.nv, topo, ts); out.R = R; return out;
   }}
];

/* ---------- 目录首页 ---------- */
let tagOn = null, view = 'cards';
function renderHome(){
  const list = SURFACES.filter(x => !tagOn || x.tags.includes(tagOn));
  $('#count').textContent = `按周期性与端的类型分类 · 已收录 ${SURFACES.length} 个曲面`;
  $('#tags').innerHTML = ['全部', ...TAGS].map(t => `<button type="button" data-t="${esc(t)}" class="${(t==='全部'?!tagOn:tagOn===t)?'on':''}">${esc(t)}</button>`).join('');
  $('#cards').innerHTML = CATS.map(c => {
    const items = list.filter(x => x.cat === c.id);
    return `<section class="cat"><h2>${c.id} · ${esc(c.name)} <small>${esc(c.desc)} · ${items.length}</small></h2>
      <div class="grid">${items.length ? items.map(x => `<button type="button" class="card" data-id="${x.id}">
        <img src="${x.thumb}" alt="${esc(x.name)} 预览">
        <div class="meta"><div class="no">${c.id} · ${esc(ENDS[x.end]||'')} · ${x.no}</div><div class="nm">${esc(x.name)}</div>
        <div class="sub">${esc(x.zh)}</div>${x.tags.map(t => `<span class="pill">${esc(t)}</span>`).join('')}</div></button>`).join('')
        : '<div class="empty">待收录</div>'}</div></section>`;
  }).join('');
  $('#list').innerHTML = `<table class="stack"><thead><tr><th>编号</th><th>名称</th><th>分类</th><th>端的类型</th><th>生成方法</th><th>来源</th><th>用途标签</th></tr></thead><tbody>${
    list.map(x => `<tr><td>${x.no}</td><td><a href="#${x.id}">${esc(x.name)}</a></td><td>${x.cat} · ${esc(CATS.find(c=>c.id===x.cat).name)}</td><td>${esc(ENDS[x.end]||'')}</td><td>${esc(x.method)}</td><td>${esc(x.source)}</td><td>${x.tags.map(esc).join(' · ')}</td></tr>`).join('')
  }</tbody></table>`;
}
$('#tags').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tagOn = b.dataset.t === '全部' ? null : b.dataset.t; renderHome(); });
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; view = b.dataset.v;
  for (const x of document.querySelectorAll('.seg button')) x.classList.toggle('on', x === b);
  $('#cards').hidden = view !== 'cards'; $('#list').hidden = view !== 'list';
});
$('#cards').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) location.hash = c.dataset.id; });
$('#back').addEventListener('click', () => { location.hash = ''; });
renderHome();

/* ---------- 预览器 ---------- */
const panel = $('#panel'), tog = $('#tog');
function setPanel(open){ panel.classList.toggle('closed', !open); tog.setAttribute('aria-expanded', open); }
tog.addEventListener('click', () => setPanel(panel.classList.contains('closed')));
if (innerWidth < 600) setPanel(false);

let S = null, P = {};
function specAll(){ return S.spec.concat(SHARED); }
function setupPanel(){
  $('#chips').innerHTML = S.presets.map((p, i) => `<button type="button" data-i="${i}">${esc(p.name)}</button>`).join('');
  $('#rows').innerHTML = specAll().map(([k,lab,mn,mx,st]) =>
    `<div class="row${k==='op' && $('#ref').style.display!=='block' ? ' hide':''}" id="row-${k}"><label for="s-${k}"><span>${esc(lab)}</span><output id="o-${k}"></output></label>
     <input type="range" id="s-${k}" data-k="${k}" min="${mn}" max="${mx}" step="${st}"></div>`).join('');
}
function syncUI(){
  for (const [k,,mn,mx0,,fmt] of specAll()){
    const s = $('#s-'+k); if (!s) continue;
    let mx = mx0; if (S.id === 's002' && k === 'a') mx = +(1/P.k - 0.005).toFixed(3);
    s.max = mx; s.value = P[k];
    s.style.setProperty('--p', ((P[k]-mn)/(mx-mn)*100)+'%');
    $('#o-'+k).textContent = fmt(+P[k]);
  }
  for (const b of document.querySelectorAll('#chips button')){
    const p = S.presets[+b.dataset.i];
    b.classList.toggle('on', S.spec.every(([k]) => Math.abs(p[k] - P[k]) < 1e-9));
  }
}

if (!window.THREE || !THREE.OrbitControls){
  toast('三维库加载失败，请刷新页面');
} else {

const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 1000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2d33, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 0.75); scene.add(key); scene.add(key.target);
const front = new THREE.MeshLambertMaterial({side:THREE.FrontSide, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
const back  = new THREE.MeshLambertMaterial({side:THREE.BackSide,  polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1});
const lineMat = new THREE.LineBasicMaterial({color:0x1b1e1a, transparent:true, opacity:0.55});
let group = null, cur = null, wire = true, radius = 1;

function rebuild(){
  const t0 = performance.now();
  const res = S.build(P);
  if (!res){ toast('这组参数下周期条件无解，换一个扭转值试试'); return; }
  cur = res;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(cur.pos, 3));
  g.setIndex(new THREE.BufferAttribute(cur.idx, 1));
  g.computeVertexNormals();
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', g.attributes.position);
  lg.setIndex(new THREE.BufferAttribute(cur.lin, 1));
  if (group){ scene.remove(group); group.children.forEach(o => o.geometry.dispose()); }
  group = new THREE.Group();
  group.add(new THREE.Mesh(g, front), new THREE.Mesh(g, back));
  const lines = new THREE.LineSegments(lg, lineMat); lines.visible = wire; group.add(lines);
  scene.add(group);
  g.computeBoundingBox(); g.computeBoundingSphere();
  const s = new THREE.Vector3(); g.boundingBox.getSize(s);
  const newR = g.boundingSphere.radius;
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() > 0 && radius > 0) camera.position.copy(controls.target).add(dir.multiplyScalar(newR/radius));
  radius = newR;
  camera.near = radius/100; camera.far = radius*40; camera.updateProjectionMatrix();
  $('#stat').textContent = `${(cur.idx.length/3).toLocaleString()} 个三角面 · ${Math.round(s.x*MM)} × ${Math.round(s.z*MM)} × ${Math.round(s.y*MM)} mm${cur.R ? ' · R = '+cur.R.toFixed(4) : ''}`;
}
function refView(){
  const d = radius*3.3, el = THREE.MathUtils.degToRad(S.view.el), az = THREE.MathUtils.degToRad(S.view.az);
  controls.target.set(0,0,0);
  camera.position.set(d*Math.cos(el)*Math.cos(az), d*Math.sin(el), -d*Math.cos(el)*Math.sin(az));
  camera.fov = THREE.MathUtils.radToDeg(2*Math.atan(radius*1.04/d/Math.min(1, camera.aspect)));
  camera.updateProjectionMatrix(); controls.update();
}
function openSurface(x){
  if (S !== x){
    S = x; P = {...x.preset}; for (const [k,,,,,,d] of SHARED) if (P[k] === undefined) P[k] = d;
    front.color.setHex(x.colors[0]); back.color.setHex(x.colors[1]);
    setupPanel(); syncUI(); radius = 0; rebuild();
  }
  $('#v-name').textContent = x.no + ' · ' + x.name; $('#v-sub').textContent = x.zh;
  resize(); refView();
}

let pending = false;
function schedule(){ if (!pending){ pending = true; requestAnimationFrame(() => { pending = false; rebuild(); }); } }
$('#rows').addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k) return;
  P[k] = +e.target.value; if (S.clamp) S.clamp(P); syncUI();
  if (k === 'op'){ $('#ref').style.opacity = P.op/100; return; }
  if (k === 't') return;
  schedule();
});
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  Object.assign(P, S.presets[+b.dataset.i]); syncUI(); rebuild(); refView();
});
$('#b-reset').addEventListener('click', refView);
$('#b-wire').addEventListener('click', e => {
  wire = !wire; if (group) group.children[2].visible = wire;
  const b = e.currentTarget; b.classList.toggle('on', wire); b.setAttribute('aria-pressed', wire);
});

const ref = $('#ref'), bRef = $('#b-ref');
let refUrl = null;
function showRef(on){
  ref.style.display = on ? 'block' : 'none'; bRef.classList.toggle('on', on); bRef.setAttribute('aria-pressed', String(on));
  const r = $('#row-op'); if (r) r.classList.toggle('hide', !on);
}
bRef.addEventListener('click', () => {
  if (ref.style.display === 'block') showRef(false);
  else if (refUrl) showRef(true);
  else $('#file').click();
});
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (refUrl) URL.revokeObjectURL(refUrl);
  refUrl = URL.createObjectURL(f); ref.src = refUrl; ref.style.opacity = P.op/100;
  showRef(true); setPanel(true); toast('参考图已叠加，拖动视角对齐');
  e.target.value = '';
});

// ---------- STL（带厚度的闭合壳体）+ ZIP ----------
function shell(){
  const src = cur.pos, idx = cur.idx, nV = src.length/3;
  const map = new Map(), remap = new Uint32Array(nV), Pp = [], q = 1e5;
  for (let v=0; v<nV; v++){
    const key = Math.round(src[v*3]*q)+','+Math.round(src[v*3+1]*q)+','+Math.round(src[v*3+2]*q);
    let id = map.get(key);
    if (id === undefined){ id = Pp.length/3; map.set(key, id); Pp.push(src[v*3], src[v*3+1], src[v*3+2]); }
    remap[v] = id;
  }
  const T = [];
  for (let i=0; i<idx.length; i+=3){ const a = remap[idx[i]], b = remap[idx[i+1]], c = remap[idx[i+2]]; if (a!==b && b!==c && a!==c) T.push(a,b,c); }
  const n = Pp.length/3, N = new Float64Array(n*3);
  for (let i=0; i<T.length; i+=3){
    const a = T[i]*3, b = T[i+1]*3, c = T[i+2]*3;
    const ux = Pp[b]-Pp[a], uy = Pp[b+1]-Pp[a+1], uz = Pp[b+2]-Pp[a+2], vx = Pp[c]-Pp[a], vy = Pp[c+1]-Pp[a+1], vz = Pp[c+2]-Pp[a+2];
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
    for (const p of [a,b,c]){ N[p]+=nx; N[p+1]+=ny; N[p+2]+=nz; }
  }
  const half = P.t/MM/2;
  if (half <= 0) return {P:Pp, T};
  const O = new Float64Array(n*6);
  for (let v=0; v<n; v++){
    const l = Math.hypot(N[v*3], N[v*3+1], N[v*3+2]) || 1;
    for (let c=0; c<3; c++){ const d = N[v*3+c]/l*half; O[v*3+c] = Pp[v*3+c]+d; O[n*3+v*3+c] = Pp[v*3+c]-d; }
  }
  const Sx = [];
  for (let i=0; i<T.length; i+=3){ Sx.push(T[i], T[i+1], T[i+2]); Sx.push(T[i]+n, T[i+2]+n, T[i+1]+n); }
  const E = new Map();
  for (let i=0; i<T.length; i+=3) for (let e=0; e<3; e++){
    const a = T[i+e], b = T[i+(e+1)%3], key = a<b ? a+'_'+b : b+'_'+a;
    const r = E.get(key); if (r) r.c++; else E.set(key, {a, b, c:1});
  }
  for (const {a, b, c} of E.values()) if (c === 1) Sx.push(a, b, b+n, a, b+n, a+n);
  return {P:O, T:Sx};
}
function stl(){
  const {P:Q, T} = shell(), nT = T.length/3;
  const buf = new ArrayBuffer(84 + 50*nT), dv = new DataView(buf);
  const head = (S.name + ' (M. Weber), mm, Z up').replace(/[^\x20-\x7e]/g, '-').slice(0, 80);
  for (let i=0; i<head.length; i++) dv.setUint8(i, head.charCodeAt(i));
  dv.setUint32(80, nT, true);
  const p = v => [Q[v*3]*MM, -Q[v*3+2]*MM, Q[v*3+1]*MM];
  let o = 84;
  for (let k=0; k<nT; k++){
    const a = p(T[k*3]), b = p(T[k*3+1]), c = p(T[k*3+2]);
    const ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2], vx = c[0]-a[0], vy = c[1]-a[1], vz = c[2]-a[2];
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx, ln = Math.hypot(nx, ny, nz) || 1;
    for (const f of [nx/ln, ny/ln, nz/ln, ...a, ...b, ...c]){ dv.setFloat32(o, f, true); o += 4; }
    dv.setUint16(o, 0, true); o += 2;
  }
  return new Uint8Array(buf);
}
const CRC = (() => { const t = new Uint32Array(256); for (let n=0; n<256; n++){ let c = n; for (let k=0; k<8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i=0; i<u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function put(dv, list){ list.forEach(([o,v,s]) => s === 4 ? dv.setUint32(o, v, true) : dv.setUint16(o, v, true)); }
function zip(name, data){
  const nm = new TextEncoder().encode(name), crc = crc32(data), sz = data.length;
  const lh = new DataView(new ArrayBuffer(30));
  put(lh, [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,0,2],[12,0x21,2],[14,crc,4],[18,sz,4],[22,sz,4],[26,nm.length,2],[28,0,2]]);
  const cd = new DataView(new ArrayBuffer(46));
  put(cd, [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,0,2],[14,0x21,2],[16,crc,4],[20,sz,4],[24,sz,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,0,4]]);
  const cdOff = 30 + nm.length + sz, cdSize = 46 + nm.length;
  const end = new DataView(new ArrayBuffer(22));
  put(end, [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,1,2],[10,1,2],[12,cdSize,4],[16,cdOff,4],[20,0,2]]);
  return new Blob([lh.buffer, nm, data, cd.buffer, nm, end.buffer]);
}
let dl = null;
if (window.claude && claude.use) claude.use('downloads').then(d => { dl = d; }).catch(() => {});
$('#b-stl').addEventListener('click', async () => {
  if (!cur) return;
  if (!dl){ toast('这个视图暂时不能下载，请在 claude.ai 打开本页'); return; }
  const tag = S.no + '-' + S.spec.map(([k]) => k + P[k]).join('-') + `-t${P.t}mm`;
  try {
    await dl.save({filename:`minimal-surface-${tag}.zip`, data:zip(`minimal-surface-${tag}.stl`, stl())});
    toast('已导出 STL（zip 压缩包内）');
  } catch (e){
    const c = e && e.code;
    toast(c === 'declined' ? '已取消导出' : c === 'rate_limited' ? '稍等片刻再试' : c === 'host_unavailable' ? '请在浏览器或电脑上打开本页导出' : '导出失败，请重试');
  }
});

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
function route(){
  const x = SURFACES.find(y => y.id === location.hash.slice(1));
  document.body.classList.toggle('v', !!x);
  if (x) openSurface(x); else window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
resize(); route();
(function loop(){
  requestAnimationFrame(loop);
  if (!document.body.classList.contains('v')) return;
  controls.update();
  key.position.copy(camera.position).add(new THREE.Vector3(0, radius, 0)); key.target.position.copy(controls.target);
  renderer.render(scene, camera);
})();
}
}
</script>
