<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机预览 · London 2100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --fg-2: rgba(255,255,255,.62);
    --fg-3: rgba(255,255,255,.38);
    --line: rgba(255,255,255,.14);
    --fill: rgba(255,255,255,.07);
    --fill-hover: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 工具栏 ── */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 600; letter-spacing: .02em; margin-right: 6px; white-space: nowrap; }
  form { display: flex; flex: 1 1 320px; min-width: 0; gap: 8px; }
  input[type="url"], select, button {
    font: inherit;
    color: var(--fg);
    background: var(--fill);
    border: 1px solid var(--line);
    border-radius: 10px;
    height: 34px;
    padding: 0 12px;
    outline: none;
  }
  input[type="url"] { flex: 1; min-width: 0; }
  input[type="url"]::placeholder { color: var(--fg-3); }
  input[type="url"]:focus-visible, select:focus-visible, button:focus-visible { border-color: var(--fg); }
  select { padding-right: 8px; cursor: pointer; }
  select option { background: #111; color: #fff; }
  button { cursor: pointer; white-space: nowrap; transition: background .15s; }
  button:hover { background: var(--fill-hover); }
  button.primary { background: var(--fg); color: #000; border-color: var(--fg); font-weight: 600; }
  button.primary:hover { background: rgba(255,255,255,.86); }
  button[aria-pressed="true"] { background: var(--fg); color: #000; border-color: var(--fg); }
  .readout { color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: auto; }

  /* ── 舞台 ── */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .fit { position: relative; }
  .device {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    padding: 12px;
    background: #0d0d0d;
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: 0 0 0 1px #000, 0 30px 80px rgba(255,255,255,.05);
  }
  .screen {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #000;
  }
  .bar {
    flex: none;
    background: #1c1c1e;
    color: var(--fg-2);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-size: 12px;
    overflow: hidden;
  }
  .bar-top { padding-bottom: 6px; font-weight: 600; color: var(--fg); }
  .bar-bottom { align-items: flex-start; padding-top: 8px; }
  .pill {
    max-width: 78%;
    height: 34px; line-height: 34px;
    padding: 0 16px;
    border-radius: 12px;
    background: rgba(255,255,255,.1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: #000; display: block; }

  footer {
    padding: 8px 14px 10px;
    border-top: 1px solid var(--line);
    color: var(--fg-3);
    font-size: 12px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <span class="brand">手机预览</span>
  <form id="form">
    <input id="url" type="url" inputmode="url" spellcheck="false" aria-label="要预览的网址" placeholder="https://…">
    <button class="primary" type="submit">打开</button>
  </form>
  <select id="device" aria-label="机型"></select>
  <button id="rotate" type="button" aria-pressed="false">横屏</button>
  <button id="bars" type="button" aria-pressed="false" title="近似模拟浏览器的状态栏和地址栏占掉的高度">浏览器栏</button>
  <button id="reload" type="button">刷新</button>
  <span class="readout" id="readout"></span>
</header>

<main id="stage">
  <div class="fit" id="fit">
    <div class="device" id="dev">
      <div class="screen" id="screen">
        <div class="bar bar-top" id="barTop">9:41</div>
        <iframe id="frame" title="手机预览" allow="fullscreen; accelerometer; gyroscope; xr-spatial-tracking; clipboard-write"></iframe>
        <div class="bar bar-bottom" id="barBottom"><span class="pill" id="pill"></span></div>
      </div>
    </div>
  </div>
</main>

<footer>
  这里显示的是电脑浏览器按手机屏幕尺寸渲染的结果：排版和布局可信，鼠标代替手指；手机上的真实速度和 iOS Safari 特有的问题不会在这里出现。
</footer>

<script>
(function () {
  // 放在仓库的 incubator/ 里时，默认打开同一站点的首页；本机双击打开时，用线上地址
  var LIVE_URL = 'https://haowang310.github.io/london-2100-generative-system/';
  var DEFAULT_URL = /^https?:$/.test(location.protocol) ? new URL('../', location.href).href : LIVE_URL;
  var KEY = 'phone-preview-v1';

  // w/h 为竖屏的 CSS 像素；top/bottom 为浏览器栏的近似高度
  var DEVICES = [
    { id: 'se',     name: 'iPhone SE · 375×667',          w: 375, h: 667,  r: 6,  top: 20, bottom: 94 },
    { id: 'i15',    name: 'iPhone 15 / 16 · 393×852',     w: 393, h: 852,  r: 46, top: 54, bottom: 139 },
    { id: 'i16p',   name: 'iPhone 16 Pro · 402×874',      w: 402, h: 874,  r: 50, top: 58, bottom: 139 },
    { id: 'i16pm',  name: 'iPhone 16 Pro Max · 440×956',  w: 440, h: 956,  r: 52, top: 58, bottom: 139 },
    { id: 'pixel',  name: 'Android (Pixel) · 412×915',    w: 412, h: 915,  r: 30, top: 80, bottom: 48 },
    { id: 'mini',   name: 'iPad mini · 744×1133',         w: 744, h: 1133, r: 22, top: 74, bottom: 0 },
    { id: 'air',    name: 'iPad Air 11" · 820×1180',      w: 820, h: 1180, r: 20, top: 74, bottom: 0 }
  ];
  var BEZEL = 12;

  var state = { url: DEFAULT_URL, dev: 'i15', land: false, bars: false };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved === 'object') {
      if (typeof saved.url === 'string' && /^https?:\/\//i.test(saved.url)) state.url = saved.url;
      if (DEVICES.some(function (d) { return d.id === saved.dev; })) state.dev = saved.dev;
      state.land = !!saved.land;
      state.bars = !!saved.bars;
    }
  } catch (e) {}

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  var $ = function (id) { return document.getElementById(id); };
  var urlInput = $('url'), deviceSel = $('device'), rotateBtn = $('rotate'), barsBtn = $('bars');
  var frame = $('frame'), stage = $('stage'), fit = $('fit'), dev = $('dev'), screenEl = $('screen');
  var barTop = $('barTop'), barBottom = $('barBottom'), pill = $('pill'), readout = $('readout');

  DEVICES.forEach(function (d) {
    var o = document.createElement('option');
    o.value = d.id; o.textContent = d.name;
    deviceSel.appendChild(o);
  });

  function current() {
    for (var i = 0; i < DEVICES.length; i++) if (DEVICES[i].id === state.dev) return DEVICES[i];
    return DEVICES[0];
  }

  function layout() {
    var d = current();
    var w = state.land ? d.h : d.w;
    var h = state.land ? d.w : d.h;

    // 浏览器栏只在竖屏时模拟
    var showBars = state.bars && !state.land;
    var top = showBars ? d.top : 0;
    var bottom = showBars ? d.bottom : 0;
    barTop.style.display = top ? 'flex' : 'none';
    barBottom.style.display = bottom ? 'flex' : 'none';
    barTop.style.height = top + 'px';
    barBottom.style.height = bottom + 'px';

    screenEl.style.width = w + 'px';
    screenEl.style.height = h + 'px';
    screenEl.style.borderRadius = d.r + 'px';
    dev.style.borderRadius = (d.r + BEZEL) + 'px';

    var outerW = w + BEZEL * 2 + 2, outerH = h + BEZEL * 2 + 2;
    var cs = getComputedStyle(stage);
    var availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var scale = Math.min(1, availW / outerW, availH / outerH);
    if (!(scale > 0)) scale = 1;

    dev.style.transform = 'scale(' + scale + ')';
    fit.style.width = Math.floor(outerW * scale) + 'px';
    fit.style.height = Math.floor(outerH * scale) + 'px';

    readout.textContent = w + ' × ' + (h - top - bottom) + ' · ' + Math.round(scale * 100) + '%';

    deviceSel.value = d.id;
    rotateBtn.setAttribute('aria-pressed', String(state.land));
    barsBtn.setAttribute('aria-pressed', String(state.bars));
    barsBtn.disabled = state.land;
    barsBtn.style.opacity = state.land ? .4 : 1;
  }

  // 每次加载都带一个时间戳参数，避免浏览器拿缓存里的旧页面
  function load() {
    var target;
    try {
      target = new URL(state.url);
    } catch (e) {
      return;
    }
    pill.textContent = target.host;
    target.searchParams.set('_preview', Date.now().toString(36));
    frame.src = target.href;
  }

  // 同一站点内可以读到里面页面的当前地址：记住它，刷新后回到同一个 app，而不是回首页
  function sync() {
    var href;
    try { href = frame.contentWindow.location.href; } catch (e) { return; }
    if (!/^https?:\/\//i.test(href)) return;
    var u = new URL(href);
    u.searchParams.delete('_preview');
    state.url = u.href;
    urlInput.value = u.href;
    pill.textContent = u.host;
    save();
  }
  frame.addEventListener('load', function () {
    sync();
    try { frame.contentWindow.addEventListener('hashchange', sync); } catch (e) {}
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = urlInput.value.trim();
    if (!v) return;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try { new URL(v); } catch (err) { return; }
    state.url = v;
    urlInput.value = v;
    save();
    load();
  });

  deviceSel.addEventListener('change', function () {
    state.dev = deviceSel.value; save(); layout();
  });
  rotateBtn.addEventListener('click', function () {
    state.land = !state.land; save(); layout();
  });
  barsBtn.addEventListener('click', function () {
    state.bars = !state.bars; save(); layout();
  });
  $('reload').addEventListener('click', load);
  window.addEventListener('resize', layout);

  urlInput.value = state.url;
  layout();
  load();
})();
</script>
</body>
</html>
