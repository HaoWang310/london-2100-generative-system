<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>London 2100 · VR / MR</title>
<style>html,body{margin:0;height:100%;background:#111113;color:#f5f5f7;font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}
#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:rgba(235,235,245,.7)}
#drop{position:fixed;inset:12px;border:2px dashed #0a84ff;border-radius:18px;display:none;place-items:center;font-size:16px;z-index:10000;background:rgba(10,132,255,.08)}</style>
</head>
<body>
<div id="msg">载入场景… · Loading the scene…</div>
<div id="drop">松开以载入场景文件 · Drop a scene file</div>
<script type="module">
import { open } from './src/xr_view.js?v=0.16';
import { apiFromScene } from './src/scene.js';
import { streamApi } from './src/stream.js?v=0.16';
const q = new URLSearchParams(location.search), lang = q.get('lang') === 'en' ? 'en' : 'zh';
const msg = document.getElementById('msg'), drop = document.getElementById('drop');
let view = null;
function show(scene, name){
  try { const api = apiFromScene(scene), t = scene.title ? (scene.title[lang] || scene.title.zh) : name; showApi(api, t); }
  catch (e){ msg.hidden = false; msg.textContent = (lang === 'zh' ? '无法打开场景：' : 'Could not open the scene: ') + e.message; console.error(e); }
}
function showApi(api, t){
  try { view?.close(); view = open(api, lang, { standalone: true, title: 'London 2100 · ' + t }); msg.hidden = true; addPicker(); }
  catch (e){ msg.hidden = false; msg.textContent = (lang === 'zh' ? '无法打开场景：' : 'Could not open the scene: ') + e.message; console.error(e); }
}
// scene list (data/scenes.json) as a menu in the viewer's bar
let scenes = [];
function addPicker(){
  const bar = document.querySelector('#tsXR .bar'); if (!bar || !scenes.length || bar.querySelector('select')) return;
  const sel = document.createElement('select'); sel.style.cssText = 'font:inherit;color:#f5f5f7;background:rgba(44,44,46,.82);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 10px';
  if (!scenes.some(s => s.file === url)){ const o = document.createElement('option'); o.value = url; o.textContent = document.querySelector('#tsXR h3')?.textContent.replace('London 2100 · ', '') || url; o.selected = true; sel.append(o); }
  for (const s of scenes){ const o = document.createElement('option'); o.value = s.file; o.textContent = s.title[lang] || s.title.zh; o.selected = s.file === url; sel.append(o); }
  sel.onchange = () => { if (sel.value.endsWith('.html')){ location.href = sel.value; return; } const u = new URL(location.href); u.searchParams.set('scene', sel.value); location.href = u.href; };
  bar.querySelector('h3').after(sel);
}
const url = q.get('scene') || 'data/hydro-lab-70km.scene.json';
fetch('data/scenes.json').then(r => r.json()).then(j => { scenes = j.scenes || []; addPicker(); }).catch(() => {});
const fail = e => { msg.hidden = false; msg.textContent = (lang === 'zh' ? '无法载入 ' : 'Could not load ') + url + ' — ' + e.message; console.error(e); };
if (url.startsWith('osm:')){
  // osm:lat,lon — live OpenStreetMap (OpenFreeMap tiles), loaded around wherever you look (src/stream.js)
  const [lat, lon, r] = url.slice(4).split(',').map(Number), name = q.get('name');
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) fail(new Error('osm:lat,lon'));
  else showApi(streamApi(lat, lon, { tiles: q.get('tiles') || undefined }), 'OSM · ' + (name || lat.toFixed(4) + ', ' + lon.toFixed(4)) + (lang === 'zh' ? ' · 移动加载' : ' · streaming'));
} else {
  fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(s => show(s, url.split('/').pop())).catch(fail);
}
// drag a scene file exported from Tensor Studio onto the page
addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'grid'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) drop.style.display = 'none'; });
addEventListener('drop', async e => { e.preventDefault(); drop.style.display = 'none'; const f = e.dataTransfer.files[0]; if (!f) return;
  try { show(JSON.parse(await f.text()), f.name); } catch (err){ msg.hidden = false; msg.textContent = err.message; } });
</script>
</body>
</html>
