<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>伦敦地图 · VR</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111113}
  #map{position:fixed;inset:0;width:100%;height:100%;border:0}
  #vr{position:fixed;z-index:20;right:12px;bottom:52px;height:34px;min-width:52px;padding:0 14px;border-radius:999px;
    border:1px solid #3a3a3e;background:rgba(14,14,16,.94);color:#f5f5f7;font:600 13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    letter-spacing:.04em;cursor:pointer;box-shadow:0 8px 20px #0004}
  #vr:hover{background:#2c2c2e}#vr:disabled{opacity:.5;cursor:progress}
  #err{position:fixed;z-index:9999;right:12px;bottom:94px;max-width:360px;padding:8px 12px;border-radius:12px;background:rgba(60,20,20,.95);
    color:#ffd7d7;font:12px/1.45 -apple-system,"PingFang SC",sans-serif;display:none}
  #cover{position:fixed;inset:0;z-index:9997;display:grid;place-items:center;background:#111113;color:rgba(235,235,245,.72);
    font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;text-align:center;line-height:1.6}
  #cover b{display:block;color:#f5f5f7;font-size:15px;font-weight:600;margin-bottom:4px}
  #cover[hidden]{display:none}
</style>
</head>
<body>
<!-- The London map, untouched. VR lives only in this folder.
     Opens straight into the VR view: OSM that loads as you move (default), or ?mode=capture for a still capture of the map with its layers. ?at=lat,lon,zoom picks the place (else the last place, else central London);
     ?map=1 starts on the map instead. The 「地图」 button in the VR view shows the map; VR goes back. -->
<iframe id="map" title="London map" allow="geolocation; fullscreen; xr-spatial-tracking"></iframe>
<button id="vr" type="button" title="VR / MR · Meta Quest">VR</button>
<div id="cover"><div><b>London 2100 · VR</b><span id="coverText">正在后台加载伦敦地图…</span></div></div>
<div id="err"></div>
<script type="module">
import { findMap } from './src/map_bridge.js?v=0.15';
import { openFromMap } from './src/from_map.js?v=0.15';
import { open } from './src/xr_view.js?v=0.15';
import { streamApi } from './src/stream.js?v=0.15';
import { mapPainter } from './src/map_painter.js?v=0.15';
import { appPanel } from './src/app_panel.js?v=0.15';
const KEY = 'london2100.vr.at', q = new URLSearchParams(location.search);
const frame = document.getElementById('map'), btn = document.getElementById('vr'), err = document.getElementById('err'), cover = document.getElementById('cover'), coverText = document.getElementById('coverText');
const mapQuery = new URLSearchParams(location.search); for (const k of ['at', 'map', 'mode', 'tiles']) mapQuery.delete(k);
frame.src = '../google-map-live/' + (mapQuery.toString() ? '?' + mapQuery : '') + location.hash;
const lang = () => (frame.contentDocument?.documentElement?.dataset.uiLanguage === 'en' ? 'en' : 'zh');
const show = m => { err.textContent = m; err.style.display = m ? 'block' : 'none'; if (m) setTimeout(() => show(''), 9000); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const parseAt = s => { const a = String(s || '').split(',').map(Number); return a.length >= 2 && a.every(Number.isFinite) ? { lat: a[0], lng: a[1], zoom: a[2] || 15.5 } : null; };
let storedAt = null; try { storedAt = localStorage.getItem(KEY); } catch (e){}

async function waitForMap(ms = 45000){
  const t0 = performance.now(); let last;
  while (performance.now() - t0 < ms){
    try { if (frame.contentDocument?.readyState === 'complete'){ const m = await findMap(frame, 800); if (m.isStyleLoaded?.() !== false) return m; } } catch (e){ last = e; }
    await sleep(500); }
  throw last || new Error('the map did not load');
}

const CAPTURE = q.get('mode') === 'capture';
async function goVR(at){
  btn.disabled = true; show('');
  try {
    if (!CAPTURE){
      // streaming: no need to wait for the map unless we take its place
      const m = await waitForMap();
      if (!at){ const c = m.getCenter(); at = { lat: c.lat, lng: c.lng, zoom: Math.max(15, m.getZoom()) }; }
      const zh = lang() === 'zh';
      // the ground in the app's own look (theme, labels, layers that are on); falls back to the plain OSM paint
      coverText.textContent = zh ? '准备 app 地图样式…' : 'Preparing the map style…';
      let painter = null; try { painter = await mapPainter(m, frame); } catch (e){ console.warn('map style', e); }
      const api = streamApi(at.lat, at.lng, { tiles: q.get('tiles') || undefined, painter });
      // the app's own control panel in VR: presses click the app's buttons; then the ground is drawn again in the new look
      let view = null;
      const panel = appPanel(frame, { lang: lang(), title: zh ? '伦敦地图' : 'London map',
        onChange: async () => { if (!painter) return; await painter.restyle(); view?.repaintTiles?.(); } });
      view = open(api, lang(), { panel, closeLabel: zh ? '地图' : 'Map', title: 'London 2100 · OSM · ' + at.lat.toFixed(4) + ', ' + at.lng.toFixed(4) + (zh ? ' · 移动加载' : ' · streaming'),
        onClose: async (info) => { cover.hidden = true; painter?.dispose();   // the map opens where you were looking in VR
          const p = info?.focus ? { ...api.stream.toLatLng(info.focus[0], info.focus[1]), zoom: at.zoom || 15.5 } : at; remember(p);
          try { const m = await waitForMap(8000); m.jumpTo({ center: [p.lng, p.lat], zoom: p.zoom }); } catch (e){} } });
      cover.hidden = true; remember(at); return;
    }
    const map = await waitForMap();
    if (at){ coverText.textContent = lang() === 'zh' ? '移动到指定位置…' : 'Moving to the place…'; map.jumpTo({ center: [at.lng, at.lat], zoom: at.zoom, pitch: 0, bearing: 0 }); await sleep(300); }
    await openFromMap(map, lang(), { closeLabel: lang() === 'zh' ? '地图' : 'Map', onClose: () => { cover.hidden = true; } });
    cover.hidden = true;
    const c = map.getCenter(); remember({ lat: c.lat, lng: c.lng, zoom: Math.max(15, map.getZoom()) });
  } catch (e){ console.error(e); cover.hidden = true; show((lang() === 'zh' ? 'VR 没能打开：' : 'VR could not open: ') + (e.message || e)); }
  finally { btn.disabled = false; }
}
// remember the place, and put it in the address so a reload shows the same scene
function remember(at){
  const s = at.lat.toFixed(5) + ',' + at.lng.toFixed(5) + ',' + (at.zoom || 15.5).toFixed(1);
  try { localStorage.setItem(KEY, s); } catch (e){}
  {   const rest = new URLSearchParams(location.search); rest.delete('at'); rest.delete('map'); history.replaceState(null, '', location.pathname + '?at=' + s + (rest.toString() ? '&' + rest : '') + location.hash); }
}

btn.onclick = () => goVR(null);   // from the map: the place the map shows now
if (q.get('map') === '1') cover.hidden = true;
else goVR(parseAt(q.get('at')) || parseAt(storedAt) || { lat: 51.50733, lng: -0.12768, zoom: 15.5 });
</script>
</body>
</html>
