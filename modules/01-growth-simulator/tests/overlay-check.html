<!doctype html>
<meta charset="utf-8">
<title>01 growth overlay: position check of the WebGL layer</title>
<!-- Draws the real custom layer with a stand-in for MapLibre's camera (the same world-pixel matrix MapLibre 6 hands
     to custom layers) and reads the picture back: every sampled parcel must show its own class colour at the screen
     position its exact EPSG:27700 -> Web Mercator projection predicts. Open over a local server; result in window.RESULT. -->
<body style="background:#111;color:#ddd;font:13px monospace">
<pre id="out">running…</pre>
<script type="module">
import { createGrowthOverlay, PALETTE } from '../overlay.js';
import { evaluateShared, inflate, sourceBase } from '../source.js';
import { cellsFromEvents, classAt } from '../cells.js';
import { toMerc } from '../georef.js';
import { toWGS84 } from '../../../shared/geo-core/index.js';

const base = sourceBase(new URL('../source.js', import.meta.url).href);
const text = u => fetch(base + u).then(r => r.text()), bin = u => fetch(base + u).then(r => r.arrayBuffer()).then(inflate);
const { D } = evaluateShared(await text('data/meta.js'), await text('controls.js'));
const M = D.meta, N = M.NX * M.NY;
const ev = { idx: new Uint32Array(await bin(D.final.idx)), cls: new Uint8Array(await bin(D.final.cls)), off: D.final.off };
const cells = cellsFromEvents(N, ev);

const W = 1024, H = 768, cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.append(cv);
const gl = cv.getContext('webgl2', { premultipliedAlpha: true, preserveDrawingBuffer: true }) || cv.getContext('webgl', { preserveDrawingBuffer: true });
let zoom = 12, year = 75, custom = null;
const map = { getZoom: () => zoom, triggerRepaint() {}, addLayer(l) { if (l.type === 'custom') { custom = l; l.onAdd(map, gl); } }, addSource() {}, getLayer: () => true, setLayoutProperty() {}, removeLayer() {}, getSource: () => null };
const overlay = createGrowthOverlay({ meta: M, rails: D.rails, stations: M.NODES, get: () => ({ cells, year, show: true }) });
overlay.attachMapLibre(map, undefined);
overlay.set({ opacity: 1, edges: true });

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function check(centreBNG, z, y) {
  zoom = z; year = y;
  const ws = 512 * 2 ** z, c = toMerc(toWGS84(centreBNG)).map(v => v * ws);
  const mvp = new Float64Array([2 / W, 0, 0, 0, 0, -2 / H, 0, 0, 0, 0, 1, 0, -2 * c[0] / W, 2 * c[1] / H, 0, 1]);
  gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  custom.render(gl, { modelViewProjectionMatrix: mvp });
  const px = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  // every parcel whose centre is on screen
  const j0 = Math.floor((centreBNG[0] - M.XMIN) / M.C), i0 = Math.floor((M.YMAX - centreBNG[1]) / M.C);
  let n = 0, bad = 0, built = 0; const span = 60, first = [];
  for (let di = -span; di <= span; di++) for (let dj = -span; dj <= span; dj++) {
    const i = i0 + di, j = j0 + dj; if (i < 0 || j < 0 || i >= M.NY || j >= M.NX) continue;
    const m = toMerc(toWGS84([M.XMIN + (j + 0.5) * M.C, M.YMAX - (i + 0.5) * M.C]));
    const sx = Math.round(m[0] * ws - c[0] + W / 2 - 0.5), sy = Math.round(m[1] * ws - c[1] + H / 2 - 0.5);
    if (sx < 2 || sy < 2 || sx >= W - 2 || sy >= H - 2) continue;
    const k = classAt(cells, i * M.NX + j, y), o = ((H - 1 - sy) * W + sx) * 4, got = [px[o], px[o + 1], px[o + 2], px[o + 3]];
    const a = k ? (k <= 3 ? 1 : 0.85) : 0, want = k ? [...hex(PALETTE[k]).map(v => v * a), a * 255] : [0, 0, 0, 0];
    n++; if (k) built++;
    if (want.some((v, q) => Math.abs(v - got[q]) > 4)) { bad++; if (first.length < 3) first.push({ i, j, k, got, want }); }
  }
  return { z, year: 2025 + y, parcels: n, built, wrong: bad, first };
}
const node = M.NODES.find(n => n[1] === 'P'), f = { e0: M.XMIN, n1: M.YMAX, e1: M.XMIN + M.NX * M.C, n0: M.YMAX - M.NY * M.C };
const places = { 'primary station': [node[2], node[3]], 'NW corner': [f.e0 + 4000, f.n1 - 4000], 'NE corner': [f.e1 - 4000, f.n1 - 4000],
  'SW corner': [f.e0 + 4000, f.n0 + 4000], 'SE corner': [f.e1 - 4000, f.n0 + 4000], 'grid centre': [(f.e0 + f.e1) / 2, (f.n0 + f.n1) / 2] };
// find built ground near each place so the samples are not all empty
const near = p => { const j0 = Math.floor((p[0] - M.XMIN) / M.C), i0 = Math.floor((M.YMAX - p[1]) / M.C); let best = p, bd = 1e9;
  for (let di = -160; di <= 160; di += 2) for (let dj = -160; dj <= 160; dj += 2) { const i = i0 + di, j = j0 + dj; if (i < 0 || j < 0 || i >= M.NY || j >= M.NX) continue;
    if (classAt(cells, i * M.NX + j, 75) && di * di + dj * dj < bd) { bd = di * di + dj * dj; best = [M.XMIN + (j + 0.5) * M.C, M.YMAX - (i + 0.5) * M.C]; } } return best; };
const out = [];
for (const [name, p] of Object.entries(places)) for (const z of [13, 15, 17]) out.push({ place: name, ...check(near(p), z, 75) });
out.push({ place: 'primary station', ...check(near(places['primary station']), 15, 30) });
window.RESULT = { webgl: gl instanceof WebGL2RenderingContext ? 2 : 1, checks: out, wrong: out.reduce((s, r) => s + r.wrong, 0), parcels: out.reduce((s, r) => s + r.parcels, 0) };
document.getElementById('out').textContent = JSON.stringify(window.RESULT, null, 1);
</script>
