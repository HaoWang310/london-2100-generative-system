<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>London 2100 · 多尺度城市生成系统</title>
  <meta name="description" content="London 2100 — Multi-Scale Generative Urban System">
  <link rel="stylesheet" href="./shared/ui/theme.css?v=6084961">
  <link rel="stylesheet" href="./app/app.css?v=6084961">
  <link rel="stylesheet" href="./app/intro.css?v=6084961">
  <link rel="stylesheet" href="./app/catalogue.css?v=6084961">
  <link rel="stylesheet" href="./app/appview.css?v=6084961">
  <link rel="preconnect" href="https://assets.mixkit.co">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" id="brandHome" role="button" tabindex="0" data-i18n-title="intro.reopen">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">London 2100</span>
        <span class="brand-sub" data-i18n="app.subtitle"></span>
      </div>
      <nav class="crumbs" id="crumbs" aria-label="Scale"></nav>
      <div class="top-actions">
        <div class="seg" role="group" aria-label="2D / 3D">
          <button id="view2d" aria-pressed="true">2D</button>
          <button id="view3d" aria-pressed="false">3D</button>
        </div>
        <div id="langToggle"></div>
        <button class="btn ghost version" id="versionButton" aria-haspopup="true" aria-expanded="false"></button>
      </div>
    </header>

    <aside class="sidenav" aria-label="Modules">
      <div class="eyebrow pad" data-i18n="nav.scales"></div>
      <ol class="modlist" id="scaleList"></ol>
      <div class="eyebrow pad" data-i18n="nav.tools"></div>
      <ol class="modlist" id="toolList"></ol>
      <div class="sidenav-foot">
        <button class="btn ghost" id="exportWorkspace" data-i18n="ws.save"></button>
        <label class="btn ghost" for="importWorkspace" data-i18n="ws.open"></label>
        <input type="file" id="importWorkspace" accept="application/json" hidden>
      </div>
    </aside>

    <main class="stage">
      <div id="map" class="map" aria-label="Map"></div>
      <div class="map-loading" id="mapLoading"><span></span><em data-i18n="map.loading"></em></div>
      <div class="map-hint" id="mapHint" hidden></div>
      <div class="map-badge" id="mapBadge" hidden></div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Parameters">
      <div class="insp-head">
        <div class="eyebrow" id="inspCode"></div>
        <h1 id="inspTitle"></h1>
        <p class="muted" id="inspDesc"></p>
        <div class="badges" id="inspBadges"></div>
      </div>
      <div class="insp-actions" id="inspActions"></div>
      <section class="insp-section">
        <div class="eyebrow" data-i18n="insp.params"></div>
        <div id="inspParams"></div>
      </section>
      <section class="insp-section">
        <div class="eyebrow" data-i18n="insp.result"></div>
        <div id="inspStats"></div>
        <p class="muted small" id="inspAlgo"></p>
      </section>
      <section class="insp-section">
        <div class="eyebrow" data-i18n="insp.legend"></div>
        <div id="legend" class="legend"></div>
      </section>
    </aside>

    <footer class="timeline">
      <button class="btn ghost play" id="playButton" aria-label="Play"></button>
      <div class="tl-track">
        <input type="range" id="scrub" min="0" max="1000" value="1000" aria-label="Timeline">
      </div>
      <div class="tl-label mono" id="tlLabel"></div>
      <div class="tl-status" id="tlStatus"></div>
    </footer>
  </div>

  <div class="popover" id="versionMenu" hidden></div>

  <section class="catalogue" id="catalogue" aria-label="Catalogue" hidden>
    <header class="cat-top">
      <button class="home" id="catHome" data-i18n-title="intro.reopen">
        <span class="brand-mark" aria-hidden="true"></span><b>London 2100</b><span data-i18n="app.subtitle"></span>
      </button>
      <span class="sp"></span>
      <div id="catLang"></div>
    </header>
    <div class="cat-wrap">
      <div class="cat-head">
        <div>
          <h1 data-i18n="cat.title"></h1>
          <p data-i18n="cat.lead"></p>
        </div>
        <span class="sp"></span>
        <span class="cat-count"></span>
      </div>
      <div class="cat-filters" role="group"></div>
      <div class="cat-grid"></div>
    </div>
  </section>

  <section class="appview" id="appview" aria-label="App" hidden>
    <header class="appview-bar">
      <button class="btn ghost appview-back" id="appviewBack"><span aria-hidden="true">←</span> <span data-i18n="cat.title"></span></button>
      <span class="appview-title"></span>
      <span class="sp"></span>
      <div id="appLang"></div>
      <a class="btn ghost appview-external" target="_blank" rel="noopener"><span data-i18n="app.openTab"></span> ↗</a>
    </header>
    <div class="appview-frame">
      <div class="map-loading appview-loading"><span></span><em data-i18n="app.loading"></em></div>
    </div>
  </section>

  <section class="intro" id="intro" aria-label="London 2100" hidden>
    <div class="intro-top">
      <span class="brand-mark" aria-hidden="true"></span><b>London 2100</b><span data-i18n="app.subtitle"></span>
      <div class="lang" id="introLang"></div>
    </div>
    <div class="intro-panels"></div>
    <div class="intro-bar">
      <div>
        <h1 data-i18n="intro.title"></h1>
        <p data-i18n="intro.tagline"></p>
      </div>
      <span class="sp"></span>
      <span class="hint" data-i18n="intro.hint"></span>
      <button class="btn primary intro-enter"><b data-i18n="intro.enter"></b> <span>→</span></button>
    </div>
  </section>

  <script type="module" src="./app/main.js?v=6084961"></script>
  <script>
    // Safety net: if the app has not started after a few seconds (e.g. a stale
    // cached file after an update), offer a clean reload instead of a blank page.
    (function () {
      function stuck() {
        if (document.documentElement.dataset.ready) return;
        var zh = !/^en/.test(localStorage.getItem('l2100.lang') || 'zh');
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;inset:0;z-index:99;display:grid;place-content:center;gap:14px;text-align:center;background:#000;color:#f5f5f7;font:14px -apple-system,"PingFang SC",sans-serif';
        box.innerHTML = '<div>' + (zh ? '页面没有正常加载，可能是浏览器缓存了旧文件。' : 'The page did not load — probably an outdated cached file.') + '</div>' +
          '<div style="color:#a1a1a6;font-size:12px">' + (zh ? '请按 Cmd+Shift+R（Windows：Ctrl+Shift+R）强制刷新' : 'Press Cmd+Shift+R (Windows: Ctrl+Shift+R) to force a refresh') + '</div>' +
          '<button style="justify-self:center;height:36px;padding:0 18px;border-radius:999px;border:0;background:#f5f5f7;color:#000;font:600 13px inherit;cursor:pointer">' +
          (zh ? '重新加载' : 'Reload') + '</button>';
        box.querySelector('button').onclick = function () { location.reload(); };
        document.body.appendChild(box);
      }
      window.addEventListener('error', function (e) { if (e.message && !document.documentElement.dataset.ready) setTimeout(stuck, 1500); });
      setTimeout(stuck, 9000);
    })();
  </script>
</body>
</html>
